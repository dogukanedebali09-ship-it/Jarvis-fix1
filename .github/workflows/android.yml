name: Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projeyi hazirla ve derle
        run: |
          mkdir -p _x
          if [ ! -f settings.gradle.kts ]; then
            n=0
            find . -name '*.zip' -not -path './_x/*' -print0 | while IFS= read -r -d '' z; do
              n=$((n+1))
              mkdir -p "_x/$n"
              unzip -oq "$z" -d "_x/$n" || true
            done
          fi
          S=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts bulunamadi. Depodaki dosyalar:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          cd "$(dirname "$S")"
          echo "Proje klasoru: $PWD"
          echo "APK_DIR=$PWD" >> "$GITHUB_ENV"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: ${{ env.APK_DIR }}/app/build/outputs/apk/debug/app-debug.apk
